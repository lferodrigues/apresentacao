<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Apresentação ao vivo</title>
  <meta name="description" content="Assista à apresentação em tempo real usando o PIN de acesso.">
  <link rel="icon" href="https://feliperodrigues.net/Assets/img/banner04.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Página inicial"><img class="brand-logo" src="https://feliperodrigues.net/Assets/img/banner04.png" alt="Felipe Rodrigues"><span class="brand-text">Apresentação <em>ao vivo</em></span></a>
    <a class="btn ghost sm" href="./">Início</a>
  </header>

  <main id="main">
    <div id="config-alert" class="alert" hidden>
      O Firebase ainda não foi configurado. Edite <code>js/firebase-config.js</code> (veja o README).
    </div>

    <!-- Entrada com PIN -->
    <section id="join" class="card center-card">
      <h1>Entrar na apresentação</h1>
      <p class="muted">Digite o PIN de 4 números informado pelo apresentador.</p>
      <form id="join-form" autocomplete="off" novalidate>
        <label for="pin" class="sr-only">PIN de acesso</label>
        <input id="pin" class="pin-input" type="text" inputmode="numeric" pattern="\d{4}"
               maxlength="4" placeholder="0000" autocomplete="one-time-code" required>
        <button class="btn primary block" type="submit" id="join-btn">Assistir</button>
        <p id="join-error" class="error" role="alert"></p>
      </form>
    </section>

    <!-- Visualização -->
    <section id="viewer" class="presentation" hidden>
      <div class="pres-bar">
        <div class="pres-info">
          <span id="v-badge" class="badge live">● AO VIVO</span>
          <strong id="v-title" class="pres-title"></strong>
        </div>
        <div class="pres-actions">
          <span id="v-page" class="page-indicator"></span>
          <button id="v-fullscreen" class="btn ghost sm" type="button" title="Tela cheia (F)">⛶ Tela cheia</button>
          <button id="v-leave" class="btn ghost sm" type="button">Sair</button>
        </div>
      </div>
      <div id="v-stage" class="stage">
        <canvas id="v-canvas"></canvas>
        <div id="v-msg" class="stage-msg"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Desenvolvido por <a href="https://feliperodrigues.net" target="_blank" rel="noopener">feliperodrigues.net</a>
  </footer>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
